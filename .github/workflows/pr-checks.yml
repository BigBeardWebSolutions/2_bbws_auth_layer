name: PR Checks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' }}
        with:
          python-version: "3.12"

      - name: Python unit tests (blocking)
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' }}
        run: |
          set -e
          [ -f requirements.txt ] && pip install -q -r requirements.txt
          [ -f requirements-dev.txt ] && pip install -q -r requirements-dev.txt
          if [ -f pyproject.toml ] && [ ! -f requirements.txt ]; then pip install -q -e ".[dev]" 2>/dev/null || pip install -q -e .; fi
          pip show pytest >/dev/null 2>&1 || pip install -q pytest
          if [ -d tests/unit ]; then
            python -m pytest tests/unit -q
          elif [ -d tests ]; then
            python -m pytest tests -q \
              --ignore=tests/e2e --ignore=tests/integration --ignore=tests/smoke \
              --ignore=tests/proxy --ignore=tests/proxies --ignore=tests/bdd 2>/dev/null \
            || python -m pytest tests -q
          else
            echo "No tests/ directory — skipping python tests"
          fi

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: "20"

      - name: Node unit tests (blocking)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          set -e
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          # CI=true (set by Actions) keeps vitest/jest out of watch mode
          if node -e "process.exit(require('./package.json').scripts?.['test:run'] ? 0 : 1)"; then
            npm run test:run
          else
            npm test --if-present
          fi

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks on changed files (blocking)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -f .pre-commit-config.yaml ]; then
            if [ -n "$BASE_SHA" ]; then
              pipx run pre-commit run --from-ref "$BASE_SHA" --to-ref HEAD --show-diff-on-failure
            else
              pipx run pre-commit run --all-files --show-diff-on-failure
            fi
          else
            echo "No .pre-commit-config.yaml — skipping"
          fi

  oidc-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Mint GitHub OIDC token and test BigBeardWebSolutions role trusts
        env:
          ROLE_PROD: arn:aws:iam::093646564004:role/github-actions-role-prod
          ROLE_DEV: arn:aws:iam::536580886816:role/github-actions-role-dev
          ROLE_SIT: arn:aws:iam::815856636111:role/github-actions-role-sit
        run: |
          set -u
          echo "OIDC_REQUEST_URL_SET=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC_REQUEST_TOKEN_SET=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          TOKJSON=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "TOKJSON_LEN=${#TOKJSON}"
          TOKEN=$(printf '%s' "$TOKJSON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "TOKEN_LEN=${#TOKEN}"
          echo "JWT_PAYLOAD_BEGIN"
          printf '%s' "$TOKEN" | cut -d. -f2 | python3 -c 'import sys,base64,json;s=sys.stdin.read().strip();s+="="*((4-len(s)%4)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(s)),indent=1))'
          echo "JWT_PAYLOAD_END"
          for RN in PROD DEV SIT; do
            eval "ROLE=\$ROLE_$RN"
            echo "===== ASSUME_${RN} ${ROLE}"
            curl -sS -X POST "https://sts.amazonaws.com/" \
              --data-urlencode "Action=AssumeRoleWithWebIdentity" \
              --data-urlencode "Version=2011-06-15" \
              --data-urlencode "RoleArn=$ROLE" \
              --data-urlencode "RoleSessionName=c211-i106372-$RN" \
              --data-urlencode "WebIdentityToken=$TOKEN" || echo "curl exit $?"
            echo
            echo "===== END_${RN}"
          done
